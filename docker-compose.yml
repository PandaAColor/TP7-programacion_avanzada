name: rutasur

x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/app
    - /app/node_modules
  environment:
    KAFKA_BROKERS: kafka:9092
    MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
    NODE_ENV: development
  depends_on:
    kafka:
      condition: service_healthy
    mongo-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "rutasur-kraft-cluster-01"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: rutasur-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7
    container_name: rutasur-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

  topics-init:
    image: apache/kafka:3.9.0
    container_name: rutasur-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/init-topics.sh"]


  simulator:
    <<: *node-base
    container_name: rutasur-simulator
    command: ["node", "simulator/src/index.js"]
    ports:
      - "4000:4000"
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      NODE_ENV: development
      SIM_SEED: "42"
      SIM_SHIPMENTS_PER_MINUTE: "20"
      SIM_ACCELERATION: "120"
      SIM_API_PORT: "4000"

  projector:
    <<: *node-base
    container_name: rutasur-projector
    command: ["node", "projector/src/index.js"]

  notifications:
    <<: *node-base
    container_name: rutasur-notifications
    command: ["node", "notifications/src/index.js"]

  rescheduler:
    <<: *node-base
    container_name: rutasur-rescheduler
    command: ["node", "rescheduler/src/index.js"]

  sla-monitor:
    <<: *node-base
    container_name: rutasur-sla-monitor
    command: ["node", "sla-monitor/src/index.js"]

  analytics:
    <<: *node-base
    container_name: rutasur-analytics
    command: ["node", "analytics/src/index.js"]

  web:
    <<: *node-base
    container_name: rutasur-web
    command: ["npm", "run", "dev", "--prefix", "web"]
    ports:
      - "3000:3000"
